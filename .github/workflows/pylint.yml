name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pdfminer.six tqdm PyDictionary
    - name: Analysing the code with pylint
      run: |
        # .github/scripts/ holds shared CI tooling (e.g. checked-bot-merge.py)
        # synced from sourcerepo, not application code - excluded from this
        # app-code style lint like other tooling/vendor dirs.
        pylint --ignore-paths='^\.github/scripts/' $(git ls-files '*.py')
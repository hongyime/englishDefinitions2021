name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pdfminer.six tqdm PyDictionary
    - name: Analysing the code with pylint
      run: |
        # .github/scripts/ holds shared CI tooling (e.g. checked-bot-merge.py)
        # synced from sourcerepo, not application code. --ignore-paths only
        # filters pylint's own directory walk, not an explicit file list, so
        # exclude it from the file list itself before pylint ever sees it.
        pylint $(git ls-files '*.py' | grep -v '^\.github/scripts/')